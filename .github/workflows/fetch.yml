name: fetch-overseas-feeds

on:
  schedule:
    - cron: "*/30 * * * *" # 境外 runner 定时抓取,与服务器侧拉取节奏对齐
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
      - name: Commit new data
        run: |
          git config user.name "relay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feeds.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "relay: update feeds $(date -u +%FT%TZ)"
            git push
          fi
